<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiragana Dojo — Level 1: あ (A)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Yuji Syuku', serif; }

  /* Signature: kelopak sakura melayang pelan di latar belakang */
  .petal {
    position: fixed;
    top: -10%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.35;
    animation-name: fall, sway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }
  @keyframes sway {
    0%, 100% { margin-left: -20px; }
    50%      { margin-left: 20px; }
  }
  #canvasWrapper { touch-action: none; }
  canvas { touch-action: none; cursor: crosshair; }

  .btn-glow:hover { box-shadow: 0 0 20px rgba(244, 114, 182, 0.5); }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen overflow-x-hidden relative">

  <!-- Kelopak sakura dekoratif -->
  <div id="petals"></div>

  <main class="relative z-10 max-w-2xl mx-auto px-4 py-8 flex flex-col items-center">

    <!-- Header -->
    <header class="text-center mb-6">
      <p class="uppercase tracking-[0.3em] text-xs text-pink-400 mb-2">Hiragana Dojo · Template Matching</p>
      <h1 class="font-display text-4xl md:text-5xl text-white">
        Level 1 — <span class="text-pink-400">あ</span>
      </h1>
      <p class="text-gray-400 mt-2 text-sm">Tulis huruf <span class="text-pink-300 font-semibold">"A" (あ)</span> di dalam kanvas mengikuti garis bantu.</p>
    </header>

    <!-- Indikator Level/Huruf -->
    <div class="flex items-center gap-3 mb-4 bg-gray-800/70 border border-pink-500/30 rounded-full px-5 py-2">
      <span class="text-xs text-gray-400">Level</span>
      <span class="text-pink-400 font-bold">1</span>
      <span class="w-px h-4 bg-gray-600"></span>
      <span class="text-xs text-gray-400">Huruf</span>
      <span class="font-display text-xl text-white">あ</span>
      <span class="w-px h-4 bg-gray-600"></span>
      <span class="text-xs text-gray-400">Skor Terbaik</span>
      <span id="bestScore" class="text-rose-300 font-bold">0%</span>
    </div>

    <!-- Canvas -->
    <div id="canvasWrapper" class="relative w-full max-w-md aspect-square rounded-2xl border-2 border-pink-500/40 bg-gray-800 shadow-[0_0_40px_-10px_rgba(236,72,153,0.4)] overflow-hidden">
      <canvas id="drawCanvas" class="absolute inset-0 w-full h-full"></canvas>
      <canvas id="gridCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
      <canvas id="guideCanvas" class="absolute inset-0 w-full h-full pointer-events-none opacity-0 transition-opacity duration-300"></canvas>
    </div>

    <!-- Kontrol -->
    <div class="flex flex-wrap justify-center gap-3 mt-6 w-full max-w-md">
      <button id="btnClear" class="flex-1 min-w-[120px] px-4 py-3 rounded-xl bg-gray-800 border border-gray-600 text-gray-200 font-semibold hover:border-pink-400 hover:text-pink-300 transition btn-glow">
        🧹 Bersihkan
      </button>
      <button id="btnGuide" class="flex-1 min-w-[120px] px-4 py-3 rounded-xl bg-gray-800 border border-gray-600 text-gray-200 font-semibold hover:border-pink-400 hover:text-pink-300 transition btn-glow">
        👁 Panduan
      </button>
      <button id="btnCheck" class="flex-1 min-w-[120px] px-4 py-3 rounded-xl bg-pink-500 text-white font-bold hover:bg-pink-400 transition shadow-lg shadow-pink-500/30 btn-glow">
        ✔ Cek Jawaban
      </button>
    </div>

    <!-- Hasil -->
    <div id="resultBox" class="w-full max-w-md mt-6 hidden">
      <div class="bg-gray-800 border border-pink-500/30 rounded-xl p-4">
        <div class="flex justify-between items-center mb-2">
          <span class="text-sm text-gray-400">Kemiripan Bentuk</span>
          <span id="resultPercent" class="text-lg font-bold text-pink-300">0%</span>
        </div>
        <div class="w-full h-3 bg-gray-700 rounded-full overflow-hidden">
          <div id="resultBar" class="h-full bg-gradient-to-r from-pink-500 to-rose-400 transition-all duration-700" style="width:0%"></div>
        </div>
        <p id="resultText" class="text-sm text-gray-300 mt-3"></p>
      </div>
    </div>

    <p class="text-xs text-gray-500 mt-8 text-center max-w-md">
      Teknik: <span class="text-pink-400">Template Matching</span> — goresanmu diubah menjadi grid piksel lalu dibandingkan dengan template kasar bentuk huruf あ.
    </p>
  </main>

<script>
/* =========================================================
   0. DEKORASI: kelopak sakura jatuh
   ========================================================= */
(function spawnPetals(){
  const container = document.getElementById('petals');
  const count = 10;
  for (let i = 0; i < count; i++) {
    const p = document.createElementNS('http://www.w3.org/2000/svg','svg');
    p.setAttribute('viewBox','0 0 24 24');
    p.setAttribute('width', 14 + Math.random()*10);
    p.setAttribute('height', 14 + Math.random()*10);
    p.classList.add('petal');
    p.style.left = Math.random()*100 + 'vw';
    const dur = 8 + Math.random()*10;
    p.style.animationDuration = dur + 's, ' + (dur/2) + 's';
    p.style.animationDelay = (-Math.random()*dur) + 's, 0s';
    p.innerHTML = '<path fill="#f472b6" d="M12 2c3 3 3 7 0 10-3-3-3-7 0-10z" transform="rotate(45 12 12)"/>';
    container.appendChild(p);
  }
})();

/* =========================================================
   1. SETUP CANVAS (responsif, rasio 1:1) + GRID 2x2
   ========================================================= */
const wrapper   = document.getElementById('canvasWrapper');
const drawCanvas  = document.getElementById('drawCanvas');
const gridCanvas  = document.getElementById('gridCanvas');
const guideCanvas = document.getElementById('guideCanvas');
const dctx  = drawCanvas.getContext('2d');
const gctx  = gridCanvas.getContext('2d');
const gdctx = guideCanvas.getContext('2d');

// Ukuran internal kanvas dibuat tetap (mis. 400x400) agar perhitungan grid template konsisten,
// sedangkan tampilan CSS-nya responsif mengikuti wrapper (rasio 1:1).
const CANVAS_SIZE = 400;
[drawCanvas, gridCanvas, guideCanvas].forEach(c => {
  c.width = CANVAS_SIZE;
  c.height = CANVAS_SIZE;
});

function drawGridLines() {
  gctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  gctx.strokeStyle = 'rgba(156,163,175,0.35)'; // abu-abu redup
  gctx.lineWidth = 1.5;
  gctx.setLineDash([6,6]);
  // garis bantu 2x2 (vertikal & horizontal di tengah)
  gctx.beginPath();
  gctx.moveTo(CANVAS_SIZE/2, 0);
  gctx.lineTo(CANVAS_SIZE/2, CANVAS_SIZE);
  gctx.moveTo(0, CANVAS_SIZE/2);
  gctx.lineTo(CANVAS_SIZE, CANVAS_SIZE/2);
  gctx.stroke();
  gctx.setLineDash([]);
  gctx.strokeStyle = 'rgba(156,163,175,0.15)';
  gctx.strokeRect(2, 2, CANVAS_SIZE-4, CANVAS_SIZE-4);
}
drawGridLines();

/* =========================================================
   2. LOGIKA MENGGAMBAR (mouse & touch)
   ========================================================= */
let drawing = false;
let lastPoint = null;

dctx.lineCap = 'round';
dctx.lineJoin = 'round';
dctx.lineWidth = 14;
dctx.strokeStyle = '#ffffff'; // goresan putih

function getPos(evt) {
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
  const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function startDraw(e) {
  e.preventDefault();
  drawing = true;
  lastPoint = getPos(e);
}
function moveDraw(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  dctx.beginPath();
  dctx.moveTo(lastPoint.x, lastPoint.y);
  dctx.lineTo(p.x, p.y);
  dctx.stroke();
  lastPoint = p;
}
function endDraw() { drawing = false; lastPoint = null; }

drawCanvas.addEventListener('mousedown', startDraw);
drawCanvas.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', endDraw);
drawCanvas.addEventListener('touchstart', startDraw, { passive:false });
drawCanvas.addEventListener('touchmove', moveDraw, { passive:false });
drawCanvas.addEventListener('touchend', endDraw);

/* =========================================================
   3. TEMPLATE KASAR HURUF あ (A)
   Didefinisikan sebagai kumpulan coretan (stroke) berupa titik-titik
   koordinat ternormalisasi (0..1) yang membentuk struktur kasar huruf あ:
   - Stroke 1: garis melengkung horizontal atas
   - Stroke 2: garis vertikal panjang menembus tengah dengan lengkungan bawah
   - Stroke 3: lengkungan kecil di kanan bawah (khas あ)
   ========================================================= */
const TEMPLATE_STROKES = [
  // stroke 1: lengkung atas
  [[0.20,0.28],[0.35,0.24],[0.55,0.24],[0.75,0.30],[0.85,0.38]],
  // stroke 2: garis vertikal utama menembus tengah, melengkung ke kiri bawah
  [[0.42,0.15],[0.40,0.40],[0.38,0.65],[0.28,0.82],[0.20,0.88]],
  // stroke 3: loop kecil kanan-bawah khas huruf あ
  [[0.55,0.55],[0.72,0.52],[0.82,0.62],[0.78,0.78],[0.62,0.85],[0.52,0.78],[0.58,0.68],[0.72,0.68]]
];

function renderTemplateToCanvas(ctx, size, lineWidth=16) {
  ctx.clearRect(0,0,size,size);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  TEMPLATE_STROKES.forEach(stroke => {
    ctx.beginPath();
    stroke.forEach(([nx,ny], i) => {
      const x = nx*size, y = ny*size;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  });
}

// Kanvas tersembunyi untuk membangun template piksel (tidak ditampilkan ke user)
const templateCanvas = document.createElement('canvas');
templateCanvas.width = CANVAS_SIZE;
templateCanvas.height = CANVAS_SIZE;
const tctx = templateCanvas.getContext('2d');
renderTemplateToCanvas(tctx, CANVAS_SIZE);

/* =========================================================
   4. TOMBOL PANDUAN (opsional): tampilkan template tipis-tipis
   ========================================================= */
let guideOn = false;
document.getElementById('btnGuide').addEventListener('click', () => {
  guideOn = !guideOn;
  if (guideOn) {
    gdctx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
    gdctx.globalAlpha = 1;
    gdctx.strokeStyle = 'rgba(244,114,182,0.9)';
    gdctx.lineWidth = 4;
    gdctx.lineCap = 'round';
    gdctx.lineJoin = 'round';
    TEMPLATE_STROKES.forEach(stroke => {
      gdctx.beginPath();
      stroke.forEach(([nx,ny], i) => {
        const x = nx*CANVAS_SIZE, y = ny*CANVAS_SIZE;
        if (i===0) gdctx.moveTo(x,y); else gdctx.lineTo(x,y);
      });
      gdctx.stroke();
    });
    guideCanvas.style.opacity = 0.35;
  } else {
    guideCanvas.style.opacity = 0;
  }
});

/* =========================================================
   5. BERSIHKAN
   ========================================================= */
document.getElementById('btnClear').addEventListener('click', () => {
  dctx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
  document.getElementById('resultBox').classList.add('hidden');
});

/* =========================================================
   6. TEMPLATE MATCHING (deteksi kemiripan bentuk)
   - Downsample kanvas gambar user & kanvas template ke grid NxN.
   - Sebuah sel dianggap "terisi" jika rata-rata alpha pikselnya > threshold.
   - Untuk toleransi kesalahan, sel template didilasi (diperluas ke tetangga)
     sehingga goresan yang sedikit meleset tetap dihitung cocok.
   - Skor akhir = rata-rata (recall, precision) dalam bentuk F1-score.
   ========================================================= */
const GRID_N = 24; // resolusi grid pembanding

function canvasToBinaryGrid(ctx, size, gridN, alphaThreshold=20) {
  const img = ctx.getImageData(0,0,size,size).data;
  const cell = size / gridN;
  const grid = new Array(gridN*gridN).fill(false);

  for (let gy=0; gy<gridN; gy++) {
    for (let gx=0; gx<gridN; gx++) {
      let sum = 0, n = 0;
      const startX = Math.floor(gx*cell), endX = Math.floor((gx+1)*cell);
      const startY = Math.floor(gy*cell), endY = Math.floor((gy+1)*cell);
      for (let y=startY; y<endY; y+=2) {
        for (let x=startX; x<endX; x+=2) {
          const idx = (y*size + x) * 4;
          sum += img[idx+3]; // channel alpha
          n++;
        }
      }
      const avgAlpha = n ? sum/n : 0;
      grid[gy*gridN+gx] = avgAlpha > alphaThreshold;
    }
  }
  return grid;
}

function dilateGrid(grid, gridN, radius=1) {
  const out = new Array(gridN*gridN).fill(false);
  for (let gy=0; gy<gridN; gy++) {
    for (let gx=0; gx<gridN; gx++) {
      if (!grid[gy*gridN+gx]) continue;
      for (let dy=-radius; dy<=radius; dy++) {
        for (let dx=-radius; dx<=radius; dx++) {
          const ny=gy+dy, nx=gx+dx;
          if (ny>=0 && ny<gridN && nx>=0 && nx<gridN) out[ny*gridN+nx] = true;
        }
      }
    }
  }
  return out;
}

function compareGrids(userGrid, templateGrid, gridN, tolerance=1) {
  const templateDilated = dilateGrid(templateGrid, gridN, tolerance);
  const userDilated     = dilateGrid(userGrid, gridN, tolerance);

  let userFilled = 0, templateFilled = 0;
  let hitRecall = 0;    // sel template yang "tertutupi" goresan user (toleran)
  let hitPrecision = 0; // sel user yang berada di area template (toleran)

  for (let i=0; i<gridN*gridN; i++) {
    if (templateGrid[i]) {
      templateFilled++;
      if (userDilated[i]) hitRecall++;
    }
    if (userGrid[i]) {
      userFilled++;
      if (templateDilated[i]) hitPrecision++;
    }
  }

  const recall = templateFilled ? hitRecall/templateFilled : 0;
  const precision = userFilled ? hitPrecision/userFilled : 0;
  const f1 = (precision+recall) > 0 ? (2*precision*recall)/(precision+recall) : 0;
  return { recall, precision, f1 };
}

/* =========================================================
   7. CEK JAWABAN
   ========================================================= */
let bestScore = 0;
document.getElementById('btnCheck').addEventListener('click', () => {
  const userGrid     = canvasToBinaryGrid(dctx, CANVAS_SIZE, GRID_N);
  const templateGrid = canvasToBinaryGrid(tctx, CANVAS_SIZE, GRID_N);

  const userInkCells = userGrid.filter(Boolean).length;
  if (userInkCells < 5) {
    alert('Kanvas masih kosong. Silakan tulis huruf あ terlebih dahulu.');
    return;
  }

  const { recall, precision, f1 } = compareGrids(userGrid, templateGrid, GRID_N, 1);
  const percent = Math.round(f1 * 100);

  bestScore = Math.max(bestScore, percent);
  document.getElementById('bestScore').textContent = bestScore + '%';

  const resultBox = document.getElementById('resultBox');
  resultBox.classList.remove('hidden');
  document.getElementById('resultPercent').textContent = percent + '%';
  document.getElementById('resultBar').style.width = percent + '%';

  const THRESHOLD = 55; // toleransi kesalahan (persentase kemiripan minimal)
  const textEl = document.getElementById('resultText');

  if (percent >= THRESHOLD) {
    textEl.innerHTML = `Bentuk huruf sudah cukup mirip dengan あ. Presisi: ${Math.round(precision*100)}%, Cakupan: ${Math.round(recall*100)}%.`;
    setTimeout(() => alert('✅ Benar! Tulisanmu mirip dengan huruf あ (skor ' + percent + '%).'), 100);
  } else {
    textEl.innerHTML = `Belum cukup mirip. Coba perhatikan lengkungan atas, garis tengah, dan loop kecil di kanan bawah. Presisi: ${Math.round(precision*100)}%, Cakupan: ${Math.round(recall*100)}%.`;
  }
});
</script>
</body>
</html>
